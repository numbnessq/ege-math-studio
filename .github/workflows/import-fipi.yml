name: Обновление снимка банка профиля
on:
  push:
    branches: [import/fipi-profile]
    paths: ['scripts/import-fipi-mirror.py', '.github/workflows/import-fipi.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4 requests
      - run: curl -fsSL --connect-timeout 6 --max-time 15 -o /dev/null https://ege.kowalt.ru/matematika-profil/bank/
      - run: python -u scripts/import-fipi-mirror.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p transport
          tar -czf - data/fipi.js data/fipi-img | base64 -w 100 | split -l 3000 - transport/part-
          git add transport data/fipi.js data/fipi-img
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Обновить оригинальные задания открытого банка"
          git push
