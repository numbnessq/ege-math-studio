name: Обновление снимка банка профиля
on:
  push:
    branches: [import/fipi-profile]
    paths: ['scripts/import-fipi.py', '.github/workflows/import-fipi.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4 requests
      - run: |
          python - <<'PY'
          import os,re,json,requests,sys
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          root='https://ege.kowalt.ru/'
          for rel in ['data/matematika-profil/40b442.json','matematika-profil/bank/','matematika-profil/problem/40b442/','data/matematika-profil.json']:
           try:
            r=requests.get(urljoin(root,rel),timeout=8);print('STATUS',rel,r.status_code,len(r.content))
            if '.json' in rel:
             j=r.json(); print('JSONINFO',list(j)[:10] if isinstance(j,dict) else len(j)); print('SAMPLE',str(j)[:1800])
            else:
             soup=BeautifulSoup(r.content,'html.parser');print('MAIN',[(e.name,e.attrs,e.get_text(' ',strip=True)[:48]) for e in soup.select('main p,main .statement,main img')[:13]])
           except Exception as exc: print('ERR',str(exc))
          PY
      - run: python -u scripts/import-fipi.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fipi.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Обновить оригинальные задания открытого банка"
          git push
