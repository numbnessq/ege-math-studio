name: Обновление снимка банка профиля
on:
  push:
    branches: [import/fipi-profile]
    paths: ['scripts/import-fipi.py', '.github/workflows/import-fipi.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4 requests
      - run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u='https://ege.kowalt.ru/matematika-profil/problem/40b442/'
          try:
           r=requests.get(u,timeout=12); print('KOWALT HTTP',r.status_code)
           s=BeautifulSoup(r.content,'html.parser')
           print('assets',[(e.name,e.get('src')) for e in s.select('script[src]')])
           print('attributes',[(e.name,e.get('class'),list(e.attrs)) for e in s.select('main *') if e.get('class')][:52])
           print('JSON',[(e.get('id'),e.get('type'),str(e.string)[:160]) for e in s.select('script:not([src])')][:15])
          except Exception as e: print('KOWALT',str(e))
          PY
      - run: python -u scripts/import-fipi.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fipi.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Обновить оригинальные задания открытого банка"
          git push
