name: Обновление снимка банка профиля
on:
  push:
    branches: [import/fipi-profile]
    paths: ['scripts/import-fipi-mirror.py', '.github/workflows/import-fipi.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4 requests
      - run: python -u scripts/import-fipi-mirror.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fipi.js data/fipi-img
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Обновить оригинальные задания открытого банка"
          git push
