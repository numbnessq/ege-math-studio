name: Разметка СтатГрада
on:
  push:
    branches: [import/statgrad-tasks]
    paths: ['scripts/import-statgrad.py', '.github/workflows/statgrad.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: pip install --break-system-packages pymupdf requests pillow
      - run: python -u scripts/import-statgrad.py
      - run: |
          if [ ! -f data/statgrad-tasks.js ]; then exit 0; fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p transport
          tar -czf - data/statgrad-tasks.js data/statgrad-img | base64 -w 100 | split -l 3000 - transport/part-
          git add transport data/statgrad-tasks.js data/statgrad-img
          git diff --cached --quiet || git commit -m "Добавить задания из открытых работ СтатГрада"
          git push
